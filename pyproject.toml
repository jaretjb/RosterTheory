[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roster-theory"
version = "0.1.0"
description = "A command-line fantasy football assistant"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{name = "Jaret Brown"}]
keywords = ["fantasy football", "Sleeper", "draft", "trade", "waivers", "decision support"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/jaretjb/RosterTheory"
Source = "https://github.com/jaretjb/RosterTheory"
Issues = "https://github.com/jaretjb/RosterTheory/issues"
Documentation = "https://github.com/jaretjb/RosterTheory#readme"

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "pip-audit==2.10.1",
  "ruff==0.16.7",
]

[project.scripts]
roster-theory = "roster_theory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roster_theory = ["resources/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start with release-critical syntax/name checks. Formatting remains a manual
# review until an intentional repository-wide baseline is approved.
select = ["E9", "F63", "F7", "F82"]
